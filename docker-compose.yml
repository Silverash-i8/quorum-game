# Start:  docker compose up --build -d      Stop:  docker compose down
# Then open http://localhost:3000/ on this computer.
name: quorum
services:
  quorum:
    build: .
    container_name: quorum
    ports:
      # HOST_PORT lets the launcher pick another port on this computer when 3000 is taken.
      - "${HOST_PORT:-3000}:3000"
    environment:
      # The address phones should open, e.g. http://192.168.1.20:3000 . start.bat fills this in for you.
      - PUBLIC_URL=${PUBLIC_URL:-}
    volumes:
      - quorum-data:/data
    restart: unless-stopped

  # Optional: a public https address, for when phones cannot reach this computer directly (for example on eduroam).
  # Start with:  docker compose --profile tunnel up --build -d
  # Find the address with:  docker compose logs tunnel   (look for https://....trycloudflare.com)
  # Then open THAT address with /host on the end, on this computer.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://quorum:3000
    depends_on:
      - quorum
    restart: unless-stopped

volumes:
  quorum-data:
